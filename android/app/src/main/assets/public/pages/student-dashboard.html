<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard · CCMMS</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body data-title="Dashboard" data-subtitle="Your maintenance requests at a glance">
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div id="topbar-mount"></div>
      <div class="content">
        <h2 style="margin-bottom:2px;">Welcome back, <span id="welcome-name">there</span> 👋</h2>
        <p class="text-soft mb-24">Here's what's happening with your complaints.</p>

        <div class="stat-grid">
          <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total Filed</div></div>
          <div class="stat-card"><div class="value" id="stat-open">0</div><div class="label">Open</div></div>
          <div class="stat-card"><div class="value" id="stat-progress">0</div><div class="label">In Progress</div></div>
          <div class="stat-card"><div class="value" id="stat-resolved">0</div><div class="label">Resolved</div></div>
        </div>

        <div class="flex-between mb-16">
          <h3 style="margin:0;">Recent Tickets</h3>
          <a href="raise-complaint.html" class="btn btn-primary btn-sm">+ Raise Complaint</a>
        </div>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/student-dashboard.js"></script>
</body>
</html>
