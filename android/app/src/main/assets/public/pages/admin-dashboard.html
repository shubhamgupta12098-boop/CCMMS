<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard · CCMMS</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body data-title="Admin Dashboard" data-subtitle="Campus-wide complaint oversight">
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div id="topbar-mount"></div>
      <div class="content">
        <h2 style="margin-bottom:2px;">Control room, <span id="welcome-name">Admin</span> 🛠️</h2>
        <p class="text-soft mb-24">Monitor and route every ticket on campus.</p>

        <div class="stat-grid">
          <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total</div></div>
          <div class="stat-card"><div class="value" id="stat-open">0</div><div class="label">Open</div></div>
          <div class="stat-card"><div class="value" id="stat-progress">0</div><div class="label">In Progress</div></div>
          <div class="stat-card"><div class="value" id="stat-resolved">0</div><div class="label">Resolved</div></div>
        </div>

        <div class="flex-between mb-16">
          <h3 style="margin:0;">All Complaints</h3>
          <select id="status-filter" style="width:auto;">
            <option value="all">All statuses</option>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div id="complaints-list"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
